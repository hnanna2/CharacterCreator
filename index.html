<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Creator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Character Creator</h1>

    <div class="creator">

        <div class="character-preview">
            <img src="assets/body/body-test.png" class="character-layer">
            <img src="assets/skin/skin_tone-test.png" class="character-layer">
            <img src="assets/hair/back/back_hair-test.png" class="character-layer">
            <img src="assets/bottoms/bottoms-test.PNG" class="character-layer">
            <img src="assets/shirts/shirt-test.png" class="character-layer">
            <img src="assets/shoes/shoes-test.PNG" class="character-layer">
            <img src="assets/hair/bangs/bangs-test.png" class="character-layer">
        </div>

        <div class="controls">
            <h2>Character</h2>

            <button>Body</button>
            <button>Skin</button>
            <button>Back Hair</button>
            <button>Bangs</button>
            <button>Shirt</button>
            <button>Bottoms</button>
            <button>Shoes</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
